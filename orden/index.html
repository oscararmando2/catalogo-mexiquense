<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Levantar Orden — El Mexiquense</title>
<!-- jsPDF + autotable (para exportar PDF) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
<!-- html5-qrcode (escaneo de código de barras con la cámara) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --green:#006847; --green-d:#00543a; --red:#c8102e; --ink:#1a1a1a;
    --muted:#6b7280; --line:#e5e7eb; --bg:#f3f4f6; --card:#ffffff;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:96px; }
  .top{ background:var(--green); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:20; }
  .top h1{ margin:0; font-size:18px; font-weight:800; letter-spacing:.3px; display:flex; align-items:center; gap:8px; }
  .top .date{ font-size:12px; opacity:.85; margin-top:2px; }
  .wrap{ max-width:640px; margin:0 auto; padding:12px 12px 0; }
  .note-in{ width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:15px; margin-top:10px; }
  .btnrow{ display:flex; gap:10px; margin-top:12px; }
  .btn{ flex:1; border:none; border-radius:12px; padding:15px 12px; font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; }
  .btn:active{ transform:translateY(1px); }
  .btn-scan{ background:var(--green); color:#fff; }
  .btn-manual{ background:#fff; color:var(--green); border:2px solid var(--green); }
  .reader-wrap{ margin-top:12px; border-radius:14px; overflow:hidden; background:#000; display:none; }
  #reader{ width:100%; }
  .reader-hint{ color:#fff; background:#000; text-align:center; font-size:13px; padding:8px; }
  .sec-title{ font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:18px 4px 8px; display:flex; justify-content:space-between; align-items:center; }
  .list{ display:flex; flex-direction:column; gap:8px; }
  .item{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; display:flex; align-items:center; gap:10px; }
  .item .qtybox{ text-align:center; min-width:64px; }
  .item .q{ font-size:20px; font-weight:800; color:var(--green); line-height:1; }
  .item .u{ font-size:11px; color:var(--muted); text-transform:uppercase; font-weight:700; }
  .item .info{ flex:1; min-width:0; }
  .item .nm{ font-size:15px; font-weight:600; }
  .item .meta{ font-size:12px; color:var(--muted); margin-top:2px; }
  .item .del{ background:none; border:none; color:var(--red); font-size:22px; padding:6px; cursor:pointer; }
  .step{ display:flex; align-items:center; gap:6px; }
  .step button{ width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:#fff; font-size:20px; font-weight:800; color:var(--ink); cursor:pointer; line-height:1; }
  .empty{ text-align:center; color:var(--muted); padding:34px 10px; font-size:15px; }
  .bar{ position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px; z-index:20; }
  .bar .btn{ font-size:15px; padding:14px 10px; }
  .btn-pdf{ background:var(--ink); color:#fff; }
  .btn-wa{ background:#25D366; color:#fff; }
  .btn-clear{ background:#fff; color:var(--red); border:2px solid var(--red); flex:0 0 54px; }
  /* Modal */
  .modal{ position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:flex-end; z-index:40; }
  .modal.open{ display:flex; }
  .sheet{ background:#fff; width:100%; max-width:640px; margin:0 auto; border-radius:18px 18px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet h2{ margin:0 0 2px; font-size:19px; }
  .sheet .sz{ color:var(--muted); font-size:14px; margin-bottom:4px; }
  .sheet .upc{ color:var(--muted); font-size:12px; font-family:monospace; margin-bottom:14px; }
  .nf{ background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; border-radius:10px; padding:8px 10px; font-size:13px; margin-bottom:12px; }
  .nf-in{ width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-size:16px; margin-bottom:14px; }
  .lbl{ font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:0 2px 7px; }
  .seg{ display:flex; gap:10px; margin-bottom:16px; }
  .seg button{ flex:1; padding:16px; border-radius:12px; border:2px solid var(--line); background:#fff; font-size:17px; font-weight:800; cursor:pointer; color:var(--ink); }
  .seg button.on{ border-color:var(--green); background:#e6f2ee; color:var(--green-d); }
  .qrow{ display:flex; align-items:center; justify-content:center; gap:18px; margin-bottom:18px; }
  .qrow button{ width:56px; height:56px; border-radius:14px; border:2px solid var(--line); background:#fff; font-size:28px; font-weight:800; cursor:pointer; }
  .qrow input{ width:96px; text-align:center; font-size:34px; font-weight:800; border:none; border-bottom:2px solid var(--green); padding:4px; color:var(--green-d); }
  .sheet-actions{ display:flex; gap:10px; }
  .sheet-actions .btn{ padding:16px; font-size:17px; }
  .btn-add{ background:var(--green); color:#fff; }
  .btn-cancel{ background:#fff; color:var(--muted); border:2px solid var(--line); flex:0 0 120px; }
  .matches{ display:flex; flex-direction:column; gap:6px; margin-bottom:8px; max-height:46vh; overflow:auto; }
  .matches button{ text-align:left; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:15px; cursor:pointer; }
  .matches button .mm{ color:var(--muted); font-size:12px; }
  .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:110px; background:var(--ink); color:#fff; padding:11px 18px; border-radius:24px; font-size:14px; font-weight:600; z-index:60; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }
  .loadbar{ font-size:12px; color:var(--muted); text-align:center; padding:6px; }
  .lnk{ background:none; border:none; color:var(--green); font-size:12px; font-weight:700; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="top">
    <h1>🧾 Levantar Orden</h1>
    <div class="date" id="topDate"></div>
  </div>

  <div class="wrap">
    <input id="notaInput" class="note-in" placeholder="Cliente / nota (opcional)">

    <div class="btnrow">
      <button class="btn btn-scan" id="scanBtn">📷 Escanear producto</button>
      <button class="btn btn-manual" id="manualBtn">⌨️ Manual</button>
    </div>

    <div class="reader-wrap" id="readerWrap">
      <div id="reader"></div>
      <div class="reader-hint" id="readerHint">Apunta al código de barras…</div>
    </div>

    <div class="loadbar" id="loadbar">Cargando productos…</div>

    <div class="sec-title">
      <span>Orden actual</span>
      <span id="counter"></span>
    </div>
    <div class="list" id="list"></div>
    <div class="empty" id="empty">Aún no hay productos.<br>Escanea o captura un UPC para empezar.</div>
  </div>

  <div class="bar">
    <button class="btn btn-clear" id="clearBtn" title="Vaciar">🗑️</button>
    <button class="btn btn-pdf" id="pdfBtn">📄 PDF</button>
    <button class="btn btn-wa" id="waBtn">🟢 WhatsApp</button>
  </div>

  <!-- Modal agregar producto -->
  <div class="modal" id="addModal">
    <div class="sheet" id="addSheet"></div>
  </div>

  <!-- Modal manual / búsqueda -->
  <div class="modal" id="manModal">
    <div class="sheet">
      <h2>Capturar producto</h2>
      <div class="sz" style="margin-bottom:12px">Escribe el UPC o parte del nombre</div>
      <input id="manInput" class="nf-in" placeholder="UPC o nombre…" autocomplete="off">
      <div class="matches" id="matches"></div>
      <div class="sheet-actions">
        <button class="btn btn-add" id="manGoBtn">Buscar</button>
        <button class="btn btn-cancel" id="manCancelBtn">Cerrar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const DB = "https://catalogomexiquense-default-rtdb.firebaseio.com";
  const CACHE_KEY = "orden_products_cache_v2";
  const ORDER_KEY = "orden_actual_v1";
  const NOTE_KEY  = "orden_nota_v1";

  // ---------- estado ----------
  let productIndex = new Map();   // coreUPC -> producto
  let productList = [];           // para búsqueda por nombre
  let order = [];                 // {upc, nombre, size, unidad:'pieza'|'caja', cant}
  let scanner = null, scanning = false, lastScan = "", lastScanAt = 0;

  const $ = id => document.getElementById(id);
  const digits = s => String(s==null?'':s).replace(/\D/g,'');
  const core   = s => digits(s).replace(/^0+/,'');
  // variantes tolerantes: exacto, sin ceros, y sin último dígito (AWG)
  function upcVariants(u){
    const c = core(u), set = new Set();
    if(c){ set.add(c); if(c.length>1) set.add(c.slice(0,-1)); }
    const d = digits(u); if(d) set.add(d.replace(/^0+/,'')||d);
    return [...set].filter(Boolean);
  }

  function toast(msg){
    const t=$("toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1800);
  }
  function fmtDate(d){ return d.toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'}); }

  // ---------- carga de productos ----------
  function indexProducts(arr){
    productIndex = new Map(); productList = [];
    arr.forEach(p=>{
      if(!p || typeof p!=='object') return;
      const nombre = p.nombre || p.name || '';
      if(!nombre && !p.upc) return;
      const rec = { upc:String(p.upc||''), nombre:nombre||'(sin nombre)', size:p.size||'', pack:p.qty||'' };
      productList.push(rec);
      upcVariants(p.upc).forEach(v=>{ if(!productIndex.has(v)) productIndex.set(v, rec); });
    });
    $("loadbar").textContent = productList.length ? (productList.length+" productos cargados · ") : "Sin productos ";
    const lnk=document.createElement('button'); lnk.className='lnk'; lnk.textContent='actualizar';
    lnk.onclick=()=>loadProducts(true); $("loadbar").appendChild(lnk);
  }
  function cacheAndIndex(arr){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ts:Date.now(), arr})); }catch(e){}
    indexProducts(arr);
  }
  function loadProducts(force){
    if(!force){
      try{ const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
        if(c && c.arr && (Date.now()-c.ts < 86400000)){ indexProducts(c.arr); return; }
      }catch(e){}
    }
    $("loadbar").textContent="Cargando base completa…";
    // 1) base COMPLETA de la tienda (endpoint /api/base, ~17k productos)
    fetch("/api/base").then(r=>{ if(!r.ok) throw new Error('sin base'); return r.json(); })
      .then(j=>{
        const arr=(j.products||[]).map(p=>({ upc:String(p.u||''), nombre:String(p.n||''), size:p.size?String(p.size):'' }));
        if(!arr.length) throw new Error('base vacía');
        cacheAndIndex(arr);
      })
      .catch(()=>{
        // 2) fallback: nodo `products` de Firebase (catálogo manual)
        fetch(DB+"/products.json").then(r=>r.json()).then(data=>{
          const raw = Array.isArray(data) ? data.filter(Boolean) : Object.values(data||{});
          const arr = raw.map(p=>({ upc:String(p&&p.upc||''), nombre:String(p&&(p.nombre||p.name)||''), size:(p&&p.size)?String(p.size):'' }));
          cacheAndIndex(arr);
        }).catch(()=>{ $("loadbar").textContent="No se pudieron cargar productos (revisa internet)."; });
      });
  }

  function findByUpc(u){
    for(const v of upcVariants(u)){ if(productIndex.has(v)) return productIndex.get(v); }
    return null;
  }
  function searchByName(q){
    q=q.trim().toLowerCase(); if(!q) return [];
    const out=[];
    for(const p of productList){ if((p.nombre||'').toLowerCase().includes(q)){ out.push(p); if(out.length>=10) break; } }
    return out;
  }

  // ---------- escáner ----------
  function fmts(){
    const F = window.Html5QrcodeSupportedFormats||{};
    return [F.UPC_A,F.UPC_E,F.EAN_13,F.EAN_8,F.CODE_128,F.CODE_39,F.ITF].filter(v=>v!==undefined);
  }
  function startScan(){
    if(scanning) return;
    if(!window.Html5Qrcode){ toast("Escáner no disponible"); return; }
    $("readerWrap").style.display="block";
    $("scanBtn").textContent="⏹️ Detener";
    const opts = { verbose:false, experimentalFeatures:{ useBarCodeDetectorIfSupported:true } };
    const ff = fmts(); if(ff.length) opts.formatsToSupport = ff;
    scanner = new Html5Qrcode("reader", opts);
    // caja ANCHA y baja (los códigos de barras 1D necesitan ancho, no alto)
    const cfg = {
      fps: 12,
      qrbox: (vw, vh)=>{ const w=Math.floor(Math.min(vw, (vh||vw))*0.92); return { width:w, height:Math.max(90, Math.floor(w*0.5)) }; },
      disableFlip: true
    };
    // pedir video en alta resolución para que las barras finas del UPC salgan nítidas
    const constraints = { facingMode:{ ideal:"environment" }, width:{ ideal:1920 }, height:{ ideal:1080 } };
    scanner.start(constraints, cfg, onScan, ()=>{})
      .then(()=>{ scanning=true; })
      .catch(()=>{
        // fallback: sin constraints de resolución (algunos iOS los rechazan)
        scanner.start({ facingMode:"environment" }, cfg, onScan, ()=>{})
          .then(()=>{ scanning=true; })
          .catch(()=>{ toast("No se pudo abrir la cámara"); stopScan(); });
      });
  }
  function stopScan(){
    $("scanBtn").textContent="📷 Escanear producto";
    $("readerWrap").style.display="none";
    scanning=false;
    if(scanner){ const s=scanner; scanner=null; s.stop().then(()=>s.clear()).catch(()=>{}); }
  }
  function toggleScan(){ scanning ? stopScan() : startScan(); }
  function onScan(text){
    const now=Date.now();
    if(text===lastScan && now-lastScanAt<2500) return;   // debounce
    lastScan=text; lastScanAt=now;
    if(scanner){ try{ scanner.pause(true); }catch(e){} }
    if(navigator.vibrate) navigator.vibrate(60);
    openAdd(text);
  }
  function resumeScanIfOn(){ if(scanner && scanning){ try{ scanner.resume(); }catch(e){} } }

  // ---------- modal agregar ----------
  let pending=null; // {upc,nombre,size,unidad,cant,found}
  function openAdd(upc, presetProd){
    const prod = presetProd || findByUpc(upc);
    pending = {
      upc: prod ? (prod.upc || digits(upc)) : digits(upc),
      nombre: prod ? prod.nombre : '',
      size: prod ? prod.size : '',
      unidad: 'pieza', cant: 1, found: !!prod
    };
    renderAdd();
    $("addModal").classList.add("open");
  }
  function renderAdd(){
    const p=pending;
    const nfBlock = p.found ? '' :
      `<div class="nf">UPC no encontrado en el catálogo. Escribe el nombre para la orden:</div>
       <input id="nfName" class="nf-in" placeholder="Nombre del producto" value="${escAttr(p.nombre)}">`;
    $("addSheet").innerHTML = `
      <h2>${p.found ? escHtml(p.nombre) : 'Producto nuevo'}</h2>
      ${p.found && p.size ? `<div class="sz">${escHtml(p.size)}</div>`:''}
      <div class="upc">UPC: ${escHtml(p.upc||'—')}</div>
      ${nfBlock}
      <div class="lbl">Unidad</div>
      <div class="seg">
        <button id="uPieza" class="${p.unidad==='pieza'?'on':''}">Piezas</button>
        <button id="uCaja"  class="${p.unidad==='caja'?'on':''}">Cajas</button>
      </div>
      <div class="lbl">Cantidad</div>
      <div class="qrow">
        <button id="qMinus">−</button>
        <input id="qInput" type="number" inputmode="numeric" min="1" value="${p.cant}">
        <button id="qPlus">+</button>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-add" id="addOk">✓ Agregar</button>
        <button class="btn btn-cancel" id="addCancel">Cancelar</button>
      </div>`;
    if(!p.found){ const nf=$("nfName"); if(nf) nf.oninput=()=>{ p.nombre=nf.value; }; }
    $("uPieza").onclick=()=>{ p.cant=Math.max(1,parseInt($("qInput").value)||1); p.unidad='pieza'; renderAdd(); };
    $("uCaja").onclick =()=>{ p.cant=Math.max(1,parseInt($("qInput").value)||1); p.unidad='caja';  renderAdd(); };
    $("qMinus").onclick=()=>{ p.cant=Math.max(1,(parseInt($("qInput").value)||1)-1); $("qInput").value=p.cant; };
    $("qPlus").onclick =()=>{ p.cant=(parseInt($("qInput").value)||1)+1; $("qInput").value=p.cant; };
    $("qInput").oninput=()=>{ p.cant=Math.max(1,parseInt($("qInput").value)||1); };
    $("addOk").onclick=confirmAdd;
    $("addCancel").onclick=closeAdd;
  }
  function confirmAdd(){
    const p=pending; p.cant=Math.max(1,parseInt($("qInput").value)||1);
    if(!p.found){ const nm=($("nfName").value||'').trim(); if(!nm){ toast("Escribe el nombre"); return; } p.nombre=nm; }
    // merge si mismo upc+unidad (o mismo nombre+unidad para nuevos)
    const key = (p.upc||p.nombre)+'|'+p.unidad;
    const ex = order.find(it=> ((it.upc||it.nombre)+'|'+it.unidad)===key );
    if(ex){ ex.cant += p.cant; } else { order.push({upc:p.upc,nombre:p.nombre,size:p.size,unidad:p.unidad,cant:p.cant}); }
    saveOrder(); renderList();
    toast(p.cant+" "+unitLabel(p.unidad,p.cant)+" agregado");
    closeAdd();
  }
  function closeAdd(){ $("addModal").classList.remove("open"); pending=null; resumeScanIfOn(); }

  // ---------- lista de la orden ----------
  function unitLabel(u,n){ if(u==='caja') return n===1?'caja':'cajas'; return n===1?'pieza':'piezas'; }
  function renderList(){
    const list=$("list");
    list.innerHTML="";
    $("empty").style.display = order.length ? "none":"block";
    order.forEach((it,i)=>{
      const row=document.createElement('div'); row.className='item';
      row.innerHTML=`
        <div class="qtybox"><div class="q">${it.cant}</div><div class="u">${unitLabel(it.unidad,it.cant)}</div></div>
        <div class="info">
          <div class="nm">${escHtml(it.nombre)}</div>
          <div class="meta">${it.size?escHtml(it.size)+' · ':''}${it.upc?('UPC '+escHtml(it.upc)):'sin UPC'}</div>
          <div class="step" style="margin-top:6px">
            <button data-a="minus">−</button>
            <button data-a="plus">+</button>
            <button data-a="unit" style="width:auto;padding:0 10px;font-size:12px;font-weight:700">${it.unidad==='caja'?'→ piezas':'→ cajas'}</button>
          </div>
        </div>
        <button class="del" data-a="del">×</button>`;
      row.querySelector('[data-a=minus]').onclick=()=>{ it.cant=Math.max(1,it.cant-1); saveOrder(); renderList(); };
      row.querySelector('[data-a=plus]').onclick =()=>{ it.cant++; saveOrder(); renderList(); };
      row.querySelector('[data-a=unit]').onclick =()=>{ it.unidad = it.unidad==='caja'?'pieza':'caja'; saveOrder(); renderList(); };
      row.querySelector('[data-a=del]').onclick  =()=>{ order.splice(i,1); saveOrder(); renderList(); };
      list.appendChild(row);
    });
    const nItems=order.length;
    const nPz=order.filter(o=>o.unidad==='pieza').reduce((a,b)=>a+b.cant,0);
    const nCj=order.filter(o=>o.unidad==='caja').reduce((a,b)=>a+b.cant,0);
    $("counter").textContent = nItems ? (nItems+' renglones · '+nCj+' cajas · '+nPz+' pzas') : '';
  }
  function saveOrder(){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
  function loadOrder(){ try{ order=JSON.parse(localStorage.getItem(ORDER_KEY)||'[]')||[]; }catch(e){ order=[]; } }

  // ---------- salidas ----------
  function orderLines(){
    return order.map((it,i)=> (i+1)+') '+it.cant+' '+unitLabel(it.unidad,it.cant)+' — '+it.nombre + (it.upc?(' ('+it.upc+')'):'') );
  }
  function exportWhatsApp(){
    if(!order.length){ toast("La orden está vacía"); return; }
    const nota=($("notaInput").value||'').trim();
    let msg = "*ORDEN — El Mexiquense*\n"+fmtDate(new Date())+"\n";
    if(nota) msg += "Cliente/Nota: "+nota+"\n";
    msg += "\n"+orderLines().join("\n");
    msg += "\n\nTotal: "+order.length+" renglones";
    window.open("https://wa.me/?text="+encodeURIComponent(msg), "_blank");
  }
  function exportPDF(){
    if(!order.length){ toast("La orden está vacía"); return; }
    if(!window.jspdf){ toast("PDF no disponible"); return; }
    const nota=($("notaInput").value||'').trim();
    const { jsPDF }=window.jspdf; const doc=new jsPDF();
    doc.autoTable({
      head:[['#','Cant.','Unidad','Producto','UPC']],
      body:order.map((it,i)=>[ i+1, it.cant, unitLabel(it.unidad,it.cant), it.nombre + (it.size?(' — '+it.size):''), it.upc||'' ]),
      theme:'grid', startY:30, margin:{left:12,right:12},
      headStyles:{ fillColor:[0,104,71], textColor:255, fontStyle:'bold' },
      styles:{ font:'helvetica', fontSize:10, cellPadding:2.5, overflow:'linebreak', valign:'middle' },
      columnStyles:{ 0:{cellWidth:12,halign:'center'}, 1:{cellWidth:16,halign:'center'}, 2:{cellWidth:22}, 3:{cellWidth:'auto'}, 4:{cellWidth:40} },
      didDrawPage:(data)=>{
        doc.setFontSize(16); doc.setTextColor(0,104,71); doc.text('Orden — El Mexiquense', data.settings.margin.left, 16);
        doc.setFontSize(10); doc.setTextColor(90);
        doc.text('Fecha: '+fmtDate(new Date())+(nota?('   ·   '+nota):''), data.settings.margin.left, 22);
      }
    });
    const d=new Date(), pad=n=>String(n).padStart(2,'0');
    doc.save('orden-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+'.pdf');
  }

  // ---------- manual / búsqueda ----------
  function openManual(){ $("manInput").value=""; $("matches").innerHTML=""; $("manModal").classList.add("open"); setTimeout(()=>$("manInput").focus(),100); }
  function closeManual(){ $("manModal").classList.remove("open"); }
  function manGo(){
    const v=($("manInput").value||'').trim(); if(!v) return;
    const onlyDigits = v.replace(/\D/g,'').length>=6 && /^[\d\s-]+$/.test(v);
    if(onlyDigits){ closeManual(); openAdd(v); return; }
    const res=searchByName(v);
    if(!res.length){ $("matches").innerHTML='<div class="mm" style="padding:8px;color:#9a3412">Sin coincidencias. Puedes agregarlo como UPC nuevo.</div>'; return; }
    $("matches").innerHTML="";
    res.forEach(p=>{
      const b=document.createElement('button');
      b.innerHTML='<div>'+escHtml(p.nombre)+'</div><div class="mm">'+(p.size?escHtml(p.size)+' · ':'')+'UPC '+escHtml(p.upc||'—')+'</div>';
      b.onclick=()=>{ closeManual(); openAdd(p.upc||p.nombre, p); };
      $("matches").appendChild(b);
    });
  }

  // ---------- utils ----------
  function escHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escAttr(s){ return escHtml(s); }

  // ---------- init ----------
  $("topDate").textContent = fmtDate(new Date());
  try{ $("notaInput").value = localStorage.getItem(NOTE_KEY)||''; }catch(e){}
  $("notaInput").addEventListener('input',()=>{ try{ localStorage.setItem(NOTE_KEY,$("notaInput").value); }catch(e){} });
  $("scanBtn").onclick=toggleScan;
  $("manualBtn").onclick=openManual;
  $("manGoBtn").onclick=manGo;
  $("manCancelBtn").onclick=closeManual;
  $("manInput").addEventListener('keydown',e=>{ if(e.key==='Enter') manGo(); });
  $("pdfBtn").onclick=exportPDF;
  $("waBtn").onclick=exportWhatsApp;
  $("clearBtn").onclick=()=>{ if(order.length && confirm('¿Vaciar toda la orden?')){ order=[]; saveOrder(); renderList(); } };
  $("addModal").addEventListener('click',e=>{ if(e.target.id==='addModal') closeAdd(); });
  $("manModal").addEventListener('click',e=>{ if(e.target.id==='manModal') closeManual(); });

  loadOrder(); renderList(); loadProducts(false);
})();
</script>
</body>
</html>
